<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Эмулятор «Мобильного ТОРО»</title>
  <style>
    :root { --bg:#eef0f3; --panel:#fff; --line:#d5d9e0; --text:#1b2430; --muted:#687385; --accent:#3a4a5e; --bad:#c62828; --bad-bg:#fdecec; --good:#2e7d32; --good-bg:#e8f5e9; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    header { background:var(--accent); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; }
    header b { font-size:17px; flex:1; }
    header a { color:#fff; font-size:14px; }
    .emu { background:#e4e7ec; border-bottom:1px solid var(--line); padding:6px 14px; font-size:13px; color:#3b4656; }
    main { max-width:760px; margin:0 auto; padding:12px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin:10px 0; }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:16px 2px 8px; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input, select, textarea { width:100%; min-height:48px; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
    button, .btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:10px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:600 15px system-ui; cursor:pointer; text-decoration:none; margin-top:10px; }
    .btn.ghost { background:#fff; color:var(--accent); }
    .msg { border-left:4px solid var(--line); }
    .msg.STOPPED { border-left-color:var(--bad); }
    .msg.ANALYZED { border-left-color:var(--good); }
    .row { display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; }
    .mono { font-family:ui-monospace, Consolas, monospace; font-weight:600; }
    .chip { font-size:12px; font-weight:600; padding:2px 8px; border-radius:4px; border:1px solid var(--line); color:var(--muted); }
    .chip.STOPPED { color:var(--bad); border-color:var(--bad); background:var(--bad-bg); }
    .chip.ANALYZED { color:var(--good); border-color:var(--good); background:var(--good-bg); }
    .res { margin-top:8px; padding:8px 10px; background:#f6f7f9; border-radius:6px; font-size:14px; white-space:pre-line; }
    .toast { background:var(--good-bg); border:1px solid var(--good); color:#1b4d1e; }
    small { color:var(--muted); }
  </style>
</head>
<body>
  <header><b>Мобильное ТОРО · осмотр</b><a href="/">ТОРО-Ассистент →</a></header>
  <div class="emu">ЭМУЛЯТОР для демонстрации интеграции. Не является продуктом предприятия: показывает только обмен сообщением М2 с «ТОРО-Ассистентом».</div>
  <main>
    <div id="toast"></div>
    <section class="panel">
      <h2 style="margin-top:0">Зарегистрировать дефект (сообщение М2)</h2>
      <form id="f">
        <label for="eq">Единица оборудования</label><select id="eq" required></select>
        <label for="t">Краткий текст</label><input id="t" required maxlength="120" placeholder="например: Слабые тормоза на спуске">
        <label for="l">Подробное описание</label><textarea id="l" rows="2" placeholder="что увидели, когда проявляется"></textarea>
        <label for="a">Кто зарегистрировал</label><input id="a" value="Механик ОТК (таб. 1042)">
        <button>Создать сообщение М2</button>
      </form>
    </section>
    <h2>Сообщения М2</h2>
    <div id="list"></div>
  </main>
  <script type="module" src="/mtoro/mtoro.js"></script>
</body>
</html>
