name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (ядро, справочник, сервер)
        run: npm test
      - name: Economics template tests
        run: python3 -m unittest discover -s tools
      - name: E2E (Playwright)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (npm start &) && sleep 2
          node tests/e2e.mjs
